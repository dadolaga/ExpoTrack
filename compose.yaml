name: ${COMPOSE_PROJECT_NAME:-expotrack-prod}

x-app: &app
  image: ${APP_IMAGE:-expotrack:production}
  build:
    context: ${SOURCE_DIR:-.}
    dockerfile: Dockerfile
  init: true
  user: "1000:1000"
  environment:
    NODE_ENV: production
    NEXT_TELEMETRY_DISABLED: "1"
    HOSTNAME: 0.0.0.0
    PORT: "3000"
    PGHOST: postgres
    PGPORT: "5432"
    PGDATABASE: expotrack
    PGUSER: expotrack_app
    PGPASSWORD: ${APP_DB_PASSWORD:?Impostare APP_DB_PASSWORD nel file env di produzione}
    CONFIG_ROOT: /config
    MEDIA_ROOT: /app/media
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    - /app/.next/cache:rw,noexec,nosuid,size=128m,uid=1000,gid=1000
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: expotrack
      POSTGRES_USER: expotrack_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Impostare POSTGRES_PASSWORD nel file env di produzione}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Impostare APP_DB_PASSWORD nel file env di produzione}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - type: bind
        source: ${DATA_DIR:?Impostare DATA_DIR con un percorso assoluto}/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
      - type: bind
        source: ./deploy/postgres-init.sh
        target: /docker-entrypoint-initdb.d/10-app-user.sh
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - database
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bootstrap:
    <<: *app
    command: ["bootstrap"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${CONFIG_DIR:?Impostare CONFIG_DIR con la cartella JSON reale}
        target: /config
        read_only: true
        bind:
          create_host_path: false
    networks:
      - database

  app:
    <<: *app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: ${DATA_DIR:?Impostare DATA_DIR con un percorso assoluto}/media
        target: /app/media
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/bootstrap', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    networks:
      - database
      - frontend

networks:
  database:
    internal: true
  frontend:
